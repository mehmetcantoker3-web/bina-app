<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bina Rehberi</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f2f4f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 450px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1c1e21; margin-bottom: 15px; font-size: 20px; }
        
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; outline: none; }
        input:focus { border-color: #007bff; }
        
        .search-box { position: sticky; top: 0; background: white; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; margin-bottom: 15px; }
        
        .add-box { background: #f8f9fa; padding: 12px; border-radius: 10px; border: 1px dashed #007bff; margin-bottom: 15px; }
        .add-box h3 { font-size: 15px; color: #007bff; margin-bottom: 5px; }
        .btn-add { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }

        .building-card { background: #ffffff; border: 1px solid #e1e4e8; border-left: 5px solid #007bff; padding: 12px; margin-bottom: 10px; border-radius: 8px; position: relative; }
        .b-title { font-weight: bold; font-size: 16px; color: #222; }
        .b-pass { font-size: 14px; color: #d9534f; font-weight: bold; margin-top: 6px; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 5px 8px; border-radius: 5px; font-size: 12px; position: absolute; right: 10px; top: 10px; cursor: pointer; width: auto; margin: 0; }
        .no-result { text-align: center; color: #888; font-size: 14px; padding: 20px 10px; }
        .loading { text-align: center; color: #007bff; font-weight: bold; font-size: 14px; padding: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bina Rehberi</h2>

    <!-- ARAMA MOTORU -->
    <div class="search-box">
        <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 Bina adı yazın (Harf harf süzülür)...">
    </div>

    <!-- YENİ BİNA EKLEME FORMU -->
    <div class="add-box">
        <h3>+ Yeni Bina Ekle</h3>
        <input type="text" id="newTitle" placeholder="Bina / Blok Adı (Örn: C Blok)">
        <input type="text" id="newPass" placeholder="Bina Şifresi (Örn: 9988)">
        <button class="btn-add" id="saveBtn" onclick="addNewBuilding()">Kaydet ve Ekle</button>
    </div>

    <!-- ALT ALTA SIRALI BİNA LİSTESİ -->
    <div id="buildingList">
        <div class="loading">Veriler yükleniyor...</div>
    </div>
</div>

<script>
    // Ücretsiz Ortak İnternet Veri Tabanı Adresi (Tüm Telefonlar İçin Ortak)
    const API_URL = "https://65d38fbf32be35010a361bc4.mockapi.io/binalar";

    let globalBuildings = [];

    // İnternetten Verileri Çek
    async function fetchBuildings() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Veri çekilemedi");
            globalBuildings = await response.json();
            renderList();
        } catch (error) {
            document.getElementById("buildingList").innerHTML = '<div class="no-result">Veriler yüklenirken hata oluştu. Bağlantınızı kontrol edin.</div>';
        }
    }

    // Listeyi Ekrana Yazdır
    function renderList() {
        const query = document.getElementById("searchInput").value.toLowerCase().trim();
        const listContainer = document.getElementById("buildingList");

        listContainer.innerHTML = "";

        const filtered = globalBuildings.filter(b => b.name && b.name.toLowerCase().includes(query));

        if (filtered.length === 0) {
            listContainer.innerHTML = '<div class="no-result">Henüz eklenmiş bir bina yok veya aramanıza uygun bina bulunamadı.</div>';
            return;
        }

        filtered.reverse().forEach(b => {
            const card = document.createElement("div");
            card.className = "building-card";
            card.innerHTML = `
                <button class="btn-delete" onclick="deleteBuilding('${b.id}')">Sil</button>
                <div class="b-title">${b.name}</div>
                <div class="b-pass">🔑 Şifre: ${b.pass}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    // Yeni Bina Ekle (Ortak Veri Tabanına Kaydeder)
    async function addNewBuilding() {
        const title = document.getElementById("newTitle").value.trim();
        const pass = document.getElementById("newPass").value.trim();
        const saveBtn = document.getElementById("saveBtn");

        if (!title || !pass) {
            alert("Lütfen Bina Adı ve Şifresini doldurun.");
            return;
        }

        saveBtn.innerText = "Kaydediliyor...";
        saveBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: title, pass: pass })
            });

            if (response.ok) {
                document.getElementById("newTitle").value = "";
                document.getElementById("newPass").value = "";
                await fetchBuildings();
                alert("Yeni bina başarıyla eklendi! Artık tüm telefonlarda görünecek.");
            } else {
                alert("Eklenirken bir hata oluştu.");
            }
        } catch (error) {
            alert("Bağlantı hatası!");
        } finally {
            saveBtn.innerText = "Kaydet ve Ekle";
            saveBtn.disabled = false;
        }
    }

    // Bina Sil (Ortak Veri Tabanından Siler)
    async function deleteBuilding(id) {
        if (confirm("Bu binayı silmek istediğinize emin misiniz?")) {
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                if (response.ok) {
                    await fetchBuildings();
                } else {
                    alert("Silinirken hata oluştu.");
                }
            } catch (error) {
                alert("Bağlantı hatası!");
            }
        }
    }

    // Sayfa açıldığında verileri canlı çek
    fetchBuildings();
</script>

</body>
</html>
